[project]
name = "open-research-lite"
version = "0.3.1"
description = "Token-Efficient Ingestion Middleware & Autonomous Research Agent with Differential Knowledge Graph."
authors = [
    { name = "open research-lite Team" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.5.4",
    "langchain-community>=0.3.9",
    "langchain-openai>=0.3.28",
    "langchain-anthropic>=0.3.15",
    "langchain-mcp-adapters>=0.1.6",
    "langchain-tavily",
    "openai>=1.99.2",
    "tavily-python>=0.5.0",
    "pydantic>=2.0.0",
    "requests>=2.32.3",
    "beautifulsoup4==4.14.3",
    "python-dotenv>=1.0.1",
    "pytest",
    "langchain-google-genai>=2.1.5",
    "rich>=13.0.0",
    "questionary>=2.0.0",
]

[project.scripts]
open-research = "open_research_lite.__main__:main"

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_research_lite*"]

[tool.setuptools.package-dir]
"" = "src"
